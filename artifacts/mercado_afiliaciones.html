<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercado afiliaciones</title>
<style>
  :root { --bg:#101418; --card:#1b242c; --ink:#f4f1ea; --muted:#a8b0b8; --lime:#d6e22a; --line:#2c3842; --red:#e35d6a; --amber:#e6c15a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px 16px 8px; position:sticky; top:0; background:var(--bg); z-index:2; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--muted); font-size:13px; margin:0 0 12px; }
  input, select { width:100%; background:#0d1216; color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:16px; }
  .filters { display:flex; gap:8px; }
  .filters select { width:46%; }
  main { padding:0 16px 32px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin:10px 0; border:1px solid var(--line); }
  .card h2 { font-size:16px; margin:0 0 6px; }
  .tag { display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:99px; margin-right:6px; }
  .now { background:var(--red); color:#fff; }
  .soon { background:var(--amber); color:#1b242c; }
  .later { background:#31404c; color:var(--ink); }
  .row { display:flex; justify-content:space-between; gap:8px; font-size:13px; padding:4px 0; border-top:1px solid var(--line); }
  .row span { color:var(--muted); }
  .money { color:var(--lime); font-weight:700; }
  .note { color:var(--amber); font-size:12px; margin-top:8px; }
  .empty { color:var(--muted); padding:24px 0; }
</style>
</head>
<body>
<header>
  <h1>Mercado de afiliación</h1>
  <p class="sub">Base del 11 de septiembre de 2026. Nuestro rodamiento de referencia: $50.000 los primeros 10 días.</p>
  <input id="q" placeholder="Buscar empresa, aseguradora o plan" autocomplete="off">
  <div class="filters" style="margin-top:8px">
    <select id="prio">
      <option value="">Todas las fechas</option>
      <option value="ya">Cazar ya</option>
      <option value="trim">Este trimestre</option>
    </select>
    <select id="ord">
      <option value="to">Orden: vence tarjeta</option>
      <option value="roda">Orden: rodamiento</option>
      <option value="pol">Orden: póliza</option>
    </select>
  </div>
</header>
<main id="list"></main>
<script>
const data = [
  ["Real Transportadora","Av. 68 #43-20","Mundial","2025-10-22",1100000,"317 440 3687","2026-10-22",60000,"Personalizado","Tarjeta este mes. El seguro del archivo ya venció: confírmalo."],
  ["Radio Taxi Autolagos","Cra 24 #71A-68","Mundial","2026-10-17",1120000,"601 811 1111","2026-11-17",73000,"1 año de rodamiento y pólizas","La más urgente. Seguro el 17 de octubre, tarjeta el 17 de noviembre."],
  ["Taxis Verdes","Cl 17 #68D-54","Equidad","2025-11-21",1480000,"411 1152","2026-11-21",50000,"1 año","Póliza más cara del archivo. Tarjeta el 21 de noviembre."],
  ["Taxatelite","Cra 68A #19-20","Mundial","2025-09-29",1078000,"762 6379","2026-12-21",55000,"1 año","Tarjeta en diciembre."],
  ["GB Transmío","Cra 30 #12B-27","Mundial","2025-11-08",1150000,"601 599 9999","2026-12-24",65000,"1 año","Comparte dirección con Nuevo Taxi Mío."],
  ["Taxis a la mano","Cl 6 #45-49","Mundial","2025-03-01",1040000,"311 476 1452","2027-03-12",60000,"1 año","Cerca de Américas."],
  ["Tax Express","Cl 13 #44-09","Mundial","2025-11-20",1100000,"318 866 4291","2027-02-19",72000,"1 año y pólizas","También aparece en $65.000 y $41.000. Usa el que diga el dueño."],
  ["Taxi Lince","Cra 50 #1G-50","Mundial","2025-04-30",1078000,"313 853 4150","2027-03-15",60000,"1 año","La otra hoja trae otra póliza. No la recites."],
  ["M&M Taxis","Av Cl 116 #70C-74","Mundial","2025-03-01",1049000,"310 321 5050","2027-03-15",47000,"2 años y pólizas","Rodamiento bajo y plan largo."],
  ["Celutaxi","Cl 63B #35-13","Estado","2027-02-01",1050000,"601 465 5555","2027-03-30",73000,"1 año","Seguro vigente hasta febrero de 2027."],
  ["Coop Teletaxi","Cra 69I #70-75","Equidad","2027-03-07",1078000,"311 6666","2027-04-18",66000,"2 años, socio","Cooperativa. No pelear la cuota."],
  ["City Taxi","Cra 69P #77-71","Equidad","2025-04-19",1078000,"225 2510","2027-04-19",66000,"Personalizado",""],
  ["Car Taxis","Cl 138 #52A-82","Equidad","2025-04-18",1170000,"666 6666","2027-04-19",68400,"Personalizado","Norte."],
  ["Taxis @","Cra 30 #45-76","Estado","2027-04-21",1150000,"318 338 3733","2027-04-20",45000,"2 años y pólizas","Rodamiento bajo. La otra hoja dice $58.000."],
  ["Nuevo Taxi Mío","Cra 30 #12B-27","Mundial","2027-04-28",1150000,"599 9999","2027-04-28",65000,"1 año de rodamiento",""],
  ["Auto Taxi Ejecutivo","Av Cl 80 #89-24","Equidad","2025-05-24",1150000,"311 215 7131","2027-05-24",73000,"1 año","Comparte sede con Taxinet."],
  ["Taxinet","Cl 80 #89-24","Equidad","2025-05-24",1050000,"310 800 2835","2027-05-24",73000,"1 año","Misma casa que Ejecutivo."],
  ["Alo Taxis","Cra 8 #163-27","Equidad","2025-11-15",1150000,"601 808 9181","2027-06-16",60000,"1 año","Norte."],
  ["Megataxi VIP","Av Américas #36-05","Equidad","2025-06-14",1280000,"311 511 1111","2027-06-30",41000,"2 años y pólizas","Cerca. Plan de 2 años y rodamiento bajo."],
  ["Taxi Cupos","Cl 13 #46-03","Equidad","2025-06-24",1100000,"744 3963","2027-07-07",54000,"1 año","Compraventa, no radio. Sirve para el dueño que está comprando."],
  ["Coomfetrans","Cra 35 #63C-52","Estado","2027-04-21",1150000,"315 322 1681","2027-07-27",50000,"1 año","Cooperativa."],
  ["Taxi Estrella","Av Caracas #8-10 Sur","Estado","2025-02-24",1150000,"300 1090","2027-08-08",45000,"1 año y medio y pólizas","Sur, cerca de Ciudad Jardín."],
  ["Taxi Ya","Cl 1C Bis #18-34","Mundial","2027-08-20",1100000,"289 1603","2027-08-20",41000,"2 años","Plan largo y rodamiento bajo."],
  ["Proturismo","Cl 69B #70-80","Estado","2026-05-26",1150000,"430 7777","2027-04-20",56000,"2 años","El seguro del archivo ya venció."],
  ["Digitax","Cra 36 #1C-13","Bolívar","2025-02-28",1000000,"312 582 3893","2027-03-28",55000,"1 año","Póliza más barata del archivo."]
];
const hoy = new Date(2026, 9, 6);
function days(iso){ const [y,m,d]=iso.split("-").map(Number); return Math.round((new Date(y,m-1,d)-hoy)/86400000); }
function money(n){ return "$"+n.toLocaleString("es-CO"); }
function draw(){
  const q = document.getElementById("q").value.toLowerCase();
  const prio = document.getElementById("prio").value;
  const ord = document.getElementById("ord").value;
  let items = data.map(r => ({n:r[0],dir:r[1],aseg:r[2],seg:r[3],pol:r[4],tel:r[5],to:r[6],roda:r[7],plan:r[8],nota:r[9],dto:days(r[6]),dseg:days(r[3])}));
  items = items.filter(x => (x.n+" "+x.aseg+" "+x.plan).toLowerCase().includes(q));
  if (prio==="ya") items = items.filter(x => x.dto<=45);
  if (prio==="trim") items = items.filter(x => x.dto>45 && x.dto<=120);
  items.sort((a,b)=> ord==="roda" ? a.roda-b.roda : ord==="pol" ? a.pol-b.pol : a.dto-b.dto);
  const root = document.getElementById("list");
  if (!items.length){ root.innerHTML = '<p class="empty">Nada con ese filtro.</p>'; return; }
  root.innerHTML = items.map(x => {
    const cls = x.dto<=45 ? "now" : x.dto<=120 ? "soon" : "later";
    const label = x.dto<=45 ? "Cazar ya" : x.dto<=120 ? "Este trimestre" : "Después";
    const vs = x.roda-50000;
    const vsTxt = vs===0 ? "igual al nuestro" : (vs>0 ? money(vs)+" más caro" : money(Math.abs(vs))+" más barato");
    return `<article class="card"><h2>${x.n}</h2><span class="tag ${cls}">${label}</span><span class="tag later">${x.plan}</span>
      <div class="row"><span>Rodamiento</span><b class="money">${money(x.roda)}</b></div>
      <div class="row"><span>Contra los $50.000</span><b>${vsTxt}</b></div>
      <div class="row"><span>Vence tarjeta</span><b>${x.to.split("-").reverse().join("/")} · ${x.dto} días</b></div>
      <div class="row"><span>Seguro ${x.aseg}</span><b>${money(x.pol)} · ${x.seg.split("-").reverse().join("/")}</b></div>
      <div class="row"><span>Teléfono</span><b>${x.tel}</b></div>
      <div class="row"><span>Dirección</span><b>${x.dir}</b></div>
      ${x.nota ? `<div class="note">${x.nota}</div>` : ""}</article>`;
  }).join("");
}
["q","prio","ord"].forEach(id => document.getElementById(id).addEventListener("input", draw));
draw();
</script>
</body>
</html>
